<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="'DejaVu Sans', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#17100a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffb24d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <g text-anchor="middle">
    <text x="640" y="104" font-size="15" letter-spacing="5" fill="#ff8c33" font-weight="600">LLAMA.CPP RUNTIME</text>
    <text x="640" y="172" font-size="62" font-weight="800" fill="#f5efe8" font-family="'DejaVu Sans Mono', monospace">AbliteratedOutTheBox</text>
    <text x="640" y="220" font-size="23" fill="#d8cdbf">Any llama.cpp model, abliterated at inference.</text>
    <text x="640" y="254" font-size="23" fill="#8a7d6b">No fit. No training. No extra files.</text>
    <rect x="510" y="278" width="260" height="2" rx="1" fill="url(#accent)"/>
  </g>
</svg>
