<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'DejaVu Sans', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#121a26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- left: wordmark and tagline -->
  <g transform="translate(88,0)">
    <text x="2" y="104" font-size="15" letter-spacing="5" fill="#58a6ff" font-weight="600">LLAMA.CPP RUNTIME</text>
    <text x="0" y="176" font-size="62" font-weight="800" fill="#e6edf3" font-family="'DejaVu Sans Mono', monospace">AbliteratedOutTheBox</text>
    <text x="2" y="230" font-size="23" fill="#adbac7">Any llama.cpp model, abliterated at inference.</text>
    <text x="2" y="266" font-size="23" fill="#768390">No fit. No training. No extra files.</text>
    <rect x="2" y="292" width="300" height="2" rx="1" fill="url(#accent)"/>
  </g>

  <!-- right: residual stream with an edited band and a projection glyph -->
  <g transform="translate(900,70)">
    <text x="0" y="-18" font-size="13" letter-spacing="2" fill="#768390">RESIDUAL STREAM</text>
    <g fill="#2b3440">
      <rect x="0" y="0" width="240" height="9" rx="4"/>
      <rect x="0" y="26" width="240" height="9" rx="4"/>
    </g>
    <g fill="url(#fade)">
      <rect x="0" y="52" width="240" height="9" rx="4"/>
      <rect x="0" y="78" width="240" height="9" rx="4"/>
      <rect x="0" y="104" width="240" height="9" rx="4"/>
    </g>
    <g fill="#2b3440">
      <rect x="0" y="130" width="240" height="9" rx="4"/>
      <rect x="0" y="156" width="240" height="9" rx="4"/>
    </g>
    <path d="M 256 56 L 272 56 L 272 135 L 256 135" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="280" y="99" font-size="13" fill="#58a6ff">edit band</text>

    <!-- projection glyph: refusal direction removed from the hidden state -->
    <g transform="translate(40,210)">
      <line x1="0" y1="0" x2="150" y2="0" stroke="#30363d" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="-70" stroke="#30363d" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="118" y2="-62" stroke="#ff7b72" stroke-width="3"/>
      <polygon points="118,-62 106,-60 112,-50" fill="#ff7b72"/>
      <line x1="0" y1="0" x2="130" y2="0" stroke="#7ee787" stroke-width="3"/>
      <polygon points="130,0 118,-6 118,6" fill="#7ee787"/>
      <line x1="118" y1="-62" x2="130" y2="0" stroke="#768390" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="150" y="-56" font-size="13" fill="#ff7b72">refusal</text>
      <text x="138" y="18" font-size="13" fill="#7ee787">answer</text>
    </g>
  </g>
</svg>
